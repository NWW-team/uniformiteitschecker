[project]
name = "uniformiteitschecker"
version = "0.1.0"
description = "Signaleert afwijkingen in uniformiteit op de websites van NederlandWereldwijd"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uniformiteitschecker = "uniformiteitschecker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uniformiteitschecker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
