[project]
name = "uniformiteitschecker"
version = "0.1.0"
description = "Signaleert afwijkingen in uniformiteit op de websites van NederlandWereldwijd"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uniformiteitschecker = "uniformiteitschecker.cli:main"
checker = "checker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "uniformiteitschecker",
    "checker",
    "checker.bronnen",
    "checker.detectie",
    "checker.rapport",
]

[tool.setuptools.package-data]
"checker.rapport" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
