# Welke pagina's horen bij elkaar, en hoe vergelijken we ze.
#
# Een nieuwe familie toevoegen is een blok YAML, geen Python -- mits de genoemde
# detectiestrategie al bestaat. Nieuwe strategieen zijn wel code, en dat is correct:
# het register in checker/detectie/register.py is de enige plek waar die bijkomen.

families:
  - id: consulaire-tarieven
    bron_id: nww-nl
    taal: nl
    sitemap: https://www.nederlandwereldwijd.nl/paginas/sitemap.xml
    pad_prefix: /consulaire-tarieven/
    detectoren:
      - zustertabel_waarden   # inhoudelijk: minderheidswaarde per rij
      - bedragnotatie         # schrijfrichtlijn: Nederlandse vs Engelse cijfernotatie
      - labeldrift            # schrijfrichtlijn: zelfde rij, andere schrijfwijze
      - eigen_terminologie    # schrijfrichtlijn: termen die nergens anders voorkomen

    # Drempels tegen ruis. Onder min_zusters is er geen norm af te leiden, en een
    # familie die in twee kampen verdeeld is (< min_eensgezind) is variatie, geen fout.
    # min_zusters staat op 20 als veiligheidsmarge voor kleine labelgroepen; gemeten op
    # de snapshot van 218 pagina's verandert dat niets aan de huidige bevindingen,
    # want die hebben allemaal n >= 35.
    min_zusters: 20
    min_eensgezind: 0.8

    # Een rijlabel dat op zoveel pagina's of minder voorkomt, geldt als eigen term.
    max_paginas_zeldzaam: 4
    # Pagina's met minder eigen termen dan dit melden we niet: een enkele eigen term is
    # te vaak een dienst die echt alleen daar bestaat.
    min_eigen_labels: 3
